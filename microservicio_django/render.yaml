# Blueprint opcional de Render para el microservicio.
# En Render también puedes configurar esto a mano en el dashboard
# ("New +" -> "Web Service" -> conectar el repo de GitHub) sin usar este archivo.
services:
  - type: web
    name: pokemon-microservicio
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn microservicio.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
